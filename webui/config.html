<html><head><title>A0 Privacy Suite - Manager</title>
<link rel="stylesheet" href="/plugins/requesty_privacy_agent/webui/privacy-settings.css">
<script type="module" src="/plugins/requesty_privacy_agent/webui/privacy-agent-store.js"></script>
</head><body><div x-data>
<template x-if="$store.privacyAgent"><div class="privacy-settings" x-init="$store.privacyAgent.open()" x-destroy="$store.privacyAgent.cleanup()" :aria-busy="$store.privacyAgent.busy">
<h2 class="section-title">A0 Privacy Suite - Manager</h2>
<p>Community-Beta 0.9.3. Unabhängiges Projekt, kein Produkt von Requesty und keine Zugehörigkeit zum Anbieter.</p>
<p>Einmal einrichten: Mindestregeln gelten für alle bestehenden und neuen Profile dieser Agent-Zero-Installation. Eigene zulässige Modelle bleiben möglich.</p>
<p><strong x-text="$store.privacyAgent.status?.diagnostics?.activation_state==='broken' ? 'Schutzstatus beschädigt · Modellaufrufe gesperrt' : $store.privacyAgent.status?.active ? 'Installationsweite Mindestregeln aktiv' : 'Installationsweite Mindestregeln noch nicht aktiv'"></strong></p>
<fieldset><legend>Schutzinstallation prüfen und reparieren</legend>
<p x-text="'Plugin: '+($store.privacyAgent.status?.diagnostics?.manager_enabled ? 'eingeschaltet' : 'ausgeschaltet')"></p>
<p x-text="'Zentraler Schutz: '+({'active':'aktiv','inactive':'bewusst deaktiviert','unconfigured':'noch nicht eingerichtet','broken':'beschädigt – Wiederherstellung erforderlich'}[$store.privacyAgent.status?.diagnostics?.activation_state]||'Status wird geprüft')"></p>
<p x-text="'Eigene Prüfhaken: '+($store.privacyAgent.status?.diagnostics?.manager_adapters?.intact ? 'vollständig' : 'fehlen, wurden verändert oder sind noch nicht eingerichtet')"></p>
<p x-show="$store.privacyAgent.status?.diagnostics?.activation_state==='broken'">Die gespeicherte Schutzkonfiguration aus einer vertrauenswürdigen Sicherung wiederherstellen. Ein beschädigter Zustand wird niemals automatisch abgeschaltet. Die Reparatur der Prüfhaken ersetzt keine verlorene Schutzkonfiguration.</p>
<details x-show="$store.privacyAgent.status?.diagnostics?.activation_error"><summary>Hinweis zur Wiederherstellung</summary><p x-text="$store.privacyAgent.status?.diagnostics?.activation_error"></p></details>
<button class="btn" type="button" @click="$store.privacyAgent.action('repair_adapters')" :disabled="$store.privacyAgent.busy || ['broken','unconfigured'].includes($store.privacyAgent.status?.diagnostics?.activation_state)">Eigene Prüfhaken wiederherstellen</button>
<p>Nur fehlende oder nachweislich eigene unveränderte Dateien werden wiederhergestellt. Bei fremden Änderungen ist eine manuelle Prüfung erforderlich. Sprachmodelle und Begleitplugins werden dadurch nicht installiert.</p>
<label><input type="checkbox" x-model="$store.privacyAgent.confirmCleanup" :disabled="$store.privacyAgent.status?.active || $store.privacyAgent.status?.diagnostics?.activation_state==='broken'"> Ich möchte nur inaktive, nachweislich eigene Prüfhaken entfernen. Schlüssel, Profile und Zuordnungen bleiben erhalten.</label>
<button class="btn" type="button" @click="$store.privacyAgent.cleanupAdapters()" :disabled="$store.privacyAgent.busy || !$store.privacyAgent.confirmCleanup || $store.privacyAgent.status?.active || $store.privacyAgent.status?.diagnostics?.activation_state==='broken'">Inaktive Prüfhaken bereinigen</button>
<p>Bei aktivem Schutz zuerst bewusst zentral deaktivieren. Ein normaler Plugin-Schalter ändert die zentrale Schutzentscheidung nicht.</p>
</fieldset>
<fieldset :disabled="$store.privacyAgent.busy"><legend>1 · Komponenten</legend>
<template x-for="(component,name) in ($store.privacyAgent.status?.components||{})" :key="name"><p x-text="({'requesty':'Model Gateway','local_privacy_guard':'Local Guard'}[name]||name)+' · '+(component.compatible ? 'bereit' : component.installed ? 'Aktualisierung erforderlich' : 'fehlt')+' '+component.version"></p></template>
<button class="btn" type="button" @click="$store.privacyAgent.action('install_dependencies')">Fehlende Plugins installieren</button>
<p>Vorhandene Plugins und ihre Einstellungen bleiben erhalten. Veraltete Versionen bitte über die native Plugin-Verwaltung aktualisieren. Nach Installation Agent Zero neu starten.</p>
</fieldset>
<fieldset :disabled="$store.privacyAgent.busy || $store.privacyAgent.status?.active"><legend>2 · Gemeinsamer Requesty-Schlüssel</legend>
<p x-text="$store.privacyAgent.status?.has_key ? 'Gemeinsamer Schlüssel gespeichert. Sein Wert wird nicht angezeigt.' : 'Noch kein gemeinsamer Schlüssel gespeichert.'"></p>
<div class="field"><div class="field-label"><label class="field-title" for="privacy-agent-key">API-Schlüssel</label></div><div class="field-control"><input id="privacy-agent-key" type="password" autocomplete="off" x-model="$store.privacyAgent.key"></div></div>
<button class="btn" type="button" @click="$store.privacyAgent.action('key',{key:$store.privacyAgent.key})" :disabled="!$store.privacyAgent.key.trim()">Schlüssel speichern</button>
</fieldset>
<details><summary>3 · Requesty-Konto zusätzlich absichern</summary>
<p>Die folgenden Einstellungen betreffen das ganze Requesty-Konto, auch andere Anwendungen. Ändere sie bewusst in Requesty; dieses Plugin ändert dort keine administrativen Regeln.</p>
<label><input type="checkbox" x-model="$store.privacyAgent.account.eu_gateway"> Serving region: EU only</label><br>
<label><input type="checkbox" x-model="$store.privacyAgent.account.requesty_zdr"> Requesty Zero data retention</label><br>
<label><input type="checkbox" x-model="$store.privacyAgent.account.provider_zdr"> Zero-data-retention models only</label><br>
<label><input type="checkbox" x-model="$store.privacyAgent.account.approved_eu_models"> Approved Models: EU-Modellstandort, keine Speicherung, kein Training geprüft</label>
<p>Gateway und Modellanbieter sind getrennte Verarbeiter. Nutzungsmetadaten bleiben gespeichert. Gesperrte Einstellungen lassen sich gegebenenfalls nur über den Support ändern.</p>
<a href="https://docs.requesty.ai/features/compliance-report" target="_blank" rel="noopener noreferrer">Anleitung bei Requesty</a>
<button class="btn" type="button" @click="$store.privacyAgent.action('account',{settings:{...$store.privacyAgent.account}})" :disabled="$store.privacyAgent.busy">Meine Bestätigung speichern</button>
<p x-text="$store.privacyAgent.status?.account?.confirmed_at ? ($store.privacyAgent.status.account_verification === 'user_confirmed' ? 'Vom Nutzer bestätigt: ' : 'Noch nicht vollständig bestätigt: ')+$store.privacyAgent.status.account.confirmed_at+' · Nicht technisch verifiziert' : 'Kontoeinstellungen nicht verifiziert'"></p>
</details>
<fieldset :disabled="$store.privacyAgent.busy"><legend>4 · Native A0-Presets</legend>
<p>Default, Efficiency und Power werden auf Requesty umgestellt. Modelle danach wie gewohnt in A0 bearbeiten; der Schutz bleibt dabei aktiv.</p>
<p x-show="$store.privacyAgent.status?.native_presets">Migration abgeschlossen. Die Modellwahl stammt ausschließlich aus den nativen A0-Presets.</p>
<p x-text="'Aktives globales Preset: '+($store.privacyAgent.status?.preset_name || 'noch nicht eingerichtet')"></p>
<button class="btn" type="button" @click="$store.privacyAgent.loadMigration()" :disabled="!$store.privacyAgent.status?.has_key || $store.privacyAgent.status?.native_presets">Umstellung ansehen</button>
<template x-if="$store.privacyAgent.preview"><div>
<p>Vorschau: Sol und Opus können deutlich mehr kosten. Die Prüfung lädt nur Katalogangaben, keine Modellantworten.</p>
<label><input type="checkbox" x-model="$store.privacyAgent.preserveCurrent" @change="$store.privacyAgent.loadMigration()"> Meine bisherige ausdrücklich gewählte Einrichtung als eigenes Preset erhalten und ausgewählt lassen</label>
<label><input type="checkbox" x-model="$store.privacyAgent.showProviders"> Anbieterspezifische Modell-IDs anzeigen</label>
<template x-for="row in $store.privacyAgent.rows" :key="row.name"><section class="privacy-card">
<h3 x-text="row.name"></h3><p x-text="$store.privacyAgent.preview.cost_categories?.[row.name] || 'Individuelles Preset'"></p>
<template x-for="role in ['main','utility','vision']" :key="role"><div class="field"><div class="field-label"><label class="field-title" :for="'privacy-preset-'+$store.privacyAgent.rows.indexOf(row)+'-'+role" x-text="role+' – '+row.name"></label></div><div class="field-control"><select :id="'privacy-preset-'+$store.privacyAgent.rows.indexOf(row)+'-'+role" @change="row[role]=$event.target.value"><option value="" :selected="!row[role]" x-text="role==='vision' ? 'Main-Modell für Bilder nutzen' : 'Modell wählen'"></option><template x-for="model in $store.privacyAgent.choices(role==='vision')" :key="model.id"><option :value="model.id" :selected="model.id===row[role]" x-text="model.id"></option></template></select></div></div></template>
</section></template>
<template x-for="error in $store.privacyAgent.preview.blocked" :key="error.name"><p role="alert" x-text="error.name+': '+error.reason"></p></template>
<p>Andere bestehende Presets bleiben erhalten. Nicht zulässige Presets können unter aktivem Schutz nicht verwendet werden.</p>
<button class="btn" type="button" @click="$store.privacyAgent.refreshMigration()">Meine Auswahl erneut prüfen</button>
<button class="btn" type="button" @click="$store.privacyAgent.applyMigration()" :disabled="!$store.privacyAgent.migrationCurrent() || $store.privacyAgent.preview.blocked.length>0">Geprüfte Umstellung mit Sicherung übernehmen</button>
</div></template>
<details><summary>Lokale Erkennung und Sprachen</summary><p>Englisch wird immer benötigt; weitere Sprachen benötigen ihre lokalen spaCy-Modelle.</p>
<template x-for="lang in ['de','fr','es','it','nl','pl']" :key="lang"><label><input type="checkbox" :value="lang" x-model="$store.privacyAgent.languages"><span x-text="lang"></span></label></template>
<button class="btn" type="button" @click="$store.privacyAgent.action('prepare_local',{languages:[...$store.privacyAgent.languages]})">Lokale Erkennung vorbereiten</button></details>
</fieldset>
<fieldset :disabled="$store.privacyAgent.busy"><legend>5 · Installation schützen</legend>
<p>Alle Profile erben EU-Modellregeln, Secret-Prüfung und lokale Embeddings. PII-Maskierung gilt als Standard; nur ausdrücklich freigegebene neue Developer-Chats erhalten die unten verwaltete Ausnahme. Unzulässige Presets blockieren Modellaufrufe.</p>
<label><input type="checkbox" x-model="$store.privacyAgent.confirmAll"> Ich möchte alle bestehenden und künftigen Profile dieser Installation schützen.</label>
<button class="btn" type="button" @click="$store.privacyAgent.activate()" :disabled="!$store.privacyAgent.confirmAll || !$store.privacyAgent.configurationCurrent() || $store.privacyAgent.status?.active">Diese Installation schützen</button>
<p x-show="!$store.privacyAgent.configurationCurrent()">Native Presets zuerst prüfen und mit Sicherung übernehmen. Erst anschließend den installationsweiten Schutz aktivieren.</p>
</fieldset>
<fieldset :disabled="$store.privacyAgent.busy"><legend>Developer ohne PII-Maskierung</legend>
<p>Nur neu hier angelegte Developer-Chats senden den gesamten Modellkontext einschließlich Memory und Unteragenten ohne PII-Maskierung. Secrets, Requesty-Regeln und lokale Embeddings bleiben geprüft. Bestehende Chats bleiben maskiert.</p>
<p><strong>Anmeldung dringend empfohlen:</strong> Für eine lokale Installation ohne externen Zugang sind Benutzername und Passwort optional. Ohne Anmeldung kann jeder mit Zugriff auf diese Oberfläche Profilausnahmen verwalten. Bei Zugriff durch andere Personen oder aus dem Netzwerk unbedingt Anmeldung einrichten und den Zugang absichern. Eine eingerichtete Anmeldung bleibt verpflichtend.</p>
<button class="btn" type="button" @click="$store.privacyAgent.action('create-developer-profile')" :disabled="!$store.privacyAgent.status?.active">Eigenes Developer-Profil anlegen</button>
<template x-for="profile in ($store.privacyAgent.status?.profile_exceptions?.profiles||[])" :key="profile.id"><div>
<p x-text="profile.id+' · '+(profile.granted ? 'Für neue unmaskierte Chats freigegeben' : 'Keine wirksame Freigabe')"></p>
<label><input type="checkbox" x-model="$store.privacyAgent.confirmUnmasked"> Ich erlaube, dass personenbezogene Daten aus dem vollständigen Modellkontext und Unteragenten unmaskiert an den Modellanbieter gelangen können.</label>
<button class="btn" type="button" @click="$store.privacyAgent.action('grant',{profile_id:profile.id,confirmation:'ALLOW_UNMASKED_CONTEXT_AND_SUBAGENTS'})" :disabled="!$store.privacyAgent.confirmUnmasked || profile.granted">Ausnahme ausdrücklich freigeben</button>
<button class="btn" type="button" @click="$store.privacyAgent.createDeveloperChat()" :disabled="!profile.granted">Neuer Developer-Chat</button>
<button class="btn" type="button" @click="$store.privacyAgent.action('revoke',{profile_id:profile.id})" :disabled="!profile.granted">Freigabe widerrufen</button>
<p>Widerruf sperrt weitere Modellaufrufe dieser Chats. Bereits zugelassene Aufrufe können abschließen. Danach einen neuen geschützten Chat beginnen. Profil- oder Projektwechsel eines unmaskierten Chats sperrt ebenfalls weitere Aufrufe.</p>
</div></template></fieldset>
<h3>Schutzstatus und Grenzen</h3>
<p x-text="$store.privacyAgent.status?.diagnostics?.activation_state==='broken' ? 'Schutzkonfiguration beschädigt. Unterstützte Modellaufrufe sind gesperrt; vertrauenswürdige Sicherung wiederherstellen.' : $store.privacyAgent.status?.active ? 'Modellroute: EU-Requesty-Anforderungen aktiv. PII-Maskierung ist Standard; freigegebene neue Developer-Chats haben eine ausdrückliche Ausnahme. Secret-Prüfung und lokale Embeddings bleiben vorgeschrieben.' : 'Installationsweite Regeln inaktiv. Der Schutz einzelner Profile hängt von deren eigener Einrichtung ab.'"></p>
<p x-text="'Gemeinsame Modelle: Main '+($store.privacyAgent.status?.models?.chat?.name || 'nicht eingerichtet')+' · Utility '+($store.privacyAgent.status?.models?.utility?.name || 'nicht eingerichtet')+' · Vision '+($store.privacyAgent.status?.models?.vision?.name || 'nicht eingerichtet')"></p>
<p>Modelle und aktive Presets stehen im nativen Chat-Menü und A0-Preset-Editor. Nicht zulässige Änderungen werden vor dem Speichern abgelehnt.</p>
<p>Bilder werden beim ausgewählten Dienst verarbeitet. Die lokale Textmaskierung schützt ihren Bildinhalt nicht.</p>
<p>Webseiten, Formulare, Uploads und andere Werkzeugübertragungen werden nicht vollständig überwacht. Browserfunktionen bleiben verfügbar. Eine zugelassene Modellroute ist keine Freigabe einer Webseite.</p>
<p>Keine vollständige Anonymisierung oder Rechtssicherheitsgarantie. Host-Administratoren und fremde Netzwerkclients liegen außerhalb dieser Plugin-Grenze.</p>
<details><summary>Installationsweiten Schutz bewusst abschalten</summary>
<p>Alle Profile verlieren die gemeinsamen Mindestregeln. Ihre vorherigen eigenen Einstellungen gelten wieder. Zugangsdaten und Konfigurationen bleiben erhalten.</p>
<label><input type="checkbox" x-model="$store.privacyAgent.confirmDisable"> Ich verstehe, dass alle Profile betroffen sind.</label>
<button class="btn" type="button" @click="$store.privacyAgent.deactivate()" :disabled="$store.privacyAgent.busy || !$store.privacyAgent.confirmDisable || !$store.privacyAgent.status?.active">Installationsweiten Schutz abschalten</button>
</details>
</div></template></div></body></html>
